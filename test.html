<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menetlevél Rendszer (Teszt)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF & AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-12">

    <!-- Navigáció / Fejléc -->
    <header class="bg-blue-600 text-white shadow-md p-4 mb-6 flex justify-between items-center">
        <h1 class="text-xl font-bold">Menetlevél Rendszer <span class="text-xs bg-yellow-400 text-gray-900 px-2 py-1 rounded ml-2">TESZT</span></h1>
        <div id="userInfo" class="hidden flex items-center gap-4">
            <span id="userEmailDisplay" class="text-sm font-medium"></span>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded transition">Kijelentkezés</button>
        </div>
    </header>

    <div class="container mx-auto px-4 max-w-4xl">

        <!-- AUTH SECTION -->
        <div id="authSection" class="bg-white p-6 rounded-xl shadow-md max-w-md mx-auto">
            <h2 class="text-2xl font-bold mb-4 text-center text-gray-700">Bejelentkezés</h2>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email cím</label>
                    <input type="email" id="loginEmail" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Jelszó</label>
                    <input type="password" id="loginPassword" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 font-semibold transition">Bejelentkezés</button>
            </form>
        </div>

        <!-- MAIN APP CONTENT -->
        <div id="appContent" class="hidden space-y-6">

            <!-- TAB NAVIGÁCIÓ (SOFŐR / ADMIN) -->
            <div class="flex border-b border-gray-200 bg-white rounded-t-xl overflow-hidden shadow-sm">
                <button id="tabDriverBtn" onclick="switchTab('driver')" class="flex-1 py-3 font-semibold text-center bg-blue-600 text-white">Sofőr Nézet</button>
                <button id="tabAdminBtn" onclick="switchTab('admin')" class="flex-1 py-3 font-semibold text-center bg-gray-100 text-gray-600 hover:bg-gray-200">Admin Panel</button>
            </div>

            <!-- SOFŐR PANEL -->
            <div id="driverPanel" class="bg-white p-6 rounded-b-xl shadow-md">
                <h2 class="text-xl font-bold mb-4 text-gray-800">Műszak Rögzítése</h2>
                <form id="shiftForm" onsubmit="saveShift(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium">Sofőr Neve</label>
                            <input type="text" id="driverName" required class="mt-1 w-full border rounded p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Rendszám</label>
                            <input type="text" id="plateNumber" required class="mt-1 w-full border rounded p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Kezdő KM</label>
                            <input type="number" id="startKm" required class="mt-1 w-full border rounded p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Záró KM</label>
                            <input type="number" id="endKm" required class="mt-1 w-full border rounded p-2">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-md font-bold hover:bg-green-700 transition">Műszak Mentése</button>
                </form>
            </div>

            <!-- EGYESÍTETT ADMIN PANEL -->
            <div id="adminPanel" class="hidden bg-white p-6 rounded-b-xl shadow-md space-y-6">
                <h2 class="text-xl font-bold text-gray-800 border-b pb-2">Adminisztrációs Panel</h2>

                <!-- SZŰRŐK & VÁLASZTÓK -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg border">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Sofőr kiválasztása:</label>
                        <select id="adminDriverSelect" onchange="onDriverSelected()" class="w-full border border-gray-300 rounded-md p-2 bg-white">
                            <option value="">-- Válassz sofőrt --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Műszak dátuma (alapértelmezett: legfrissebb):</label>
                        <select id="adminShiftDateSelect" onchange="renderSelectedShift()" class="w-full border border-gray-300 rounded-md p-2 bg-white" disabled>
                            <option value="">-- Előbb válassz sofőrt --</option>
                        </select>
                    </div>
                </div>

                <!-- MŰSZAK RÉSZLETEK & KIMENET -->
                <div id="shiftDetailsContainer" class="hidden space-y-4">
                    <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                        <h3 class="font-bold text-blue-900 mb-2">Műszak Részletei</h3>
                        <div id="shiftDetailsContent" class="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm"></div>
                    </div>

                    <div class="flex gap-4">
                        <button onclick="previewPDF()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-md transition flex items-center justify-center gap-2">
                            <span>📄</span> PDF Megtekintése Új Lapodon
                        </button>
                        <button onclick="deleteCurrentShift()" class="bg-gray-200 hover:bg-red-100 text-red-600 font-semibold px-4 py-2.5 rounded-md border border-red-300 transition">
                            Műszak Törlése
                        </button>
                    </div>
                </div>

                <div id="noShiftMessage" class="text-center py-8 text-gray-500 italic">
                    Válassz ki egy sofőrt a műszakok megtekintéséhez!
                </div>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT LOGIKA -->
    <script>
        // FIREBASE INITIALIZATION
        const firebaseConfig = {
            apiKey: "AIzaSyCzpvcJSd08o2mpLOibQKEv6tLes0BixFM",
            authDomain: "menetlevel-3563a.firebaseapp.com",
            projectId: "menetlevel-3563a",
            storageBucket: "menetlevel-3563a.firebasestorage.app",
            messagingSenderId: "3063555023",
            appId: "1:3063555023:web:fdd44585f7946d6fddfc4a",
            measurementId: "G-9NNKD3N84H"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let allShifts = [];
        let currentDriverShifts = [];
        let selectedShiftData = null;

        // AUTH LISTENERS
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('appContent').classList.remove('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
                document.getElementById('userEmailDisplay').innerText = user.email;
                loadAllShifts();
            } else {
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('appContent').classList.add('hidden');
                document.getElementById('userInfo').classList.add('hidden');
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            auth.signInWithEmailAndPassword(email, pass).catch(err => alert("Hiba a bejelentkezésnél: " + err.message));
        }

        function logout() {
            auth.signOut();
        }

        // TAB SWITCHING
        function switchTab(tab) {
            const driverPanel = document.getElementById('driverPanel');
            const adminPanel = document.getElementById('adminPanel');
            const tabDriverBtn = document.getElementById('tabDriverBtn');
            const tabAdminBtn = document.getElementById('tabAdminBtn');

            if (tab === 'driver') {
                driverPanel.classList.remove('hidden');
                adminPanel.classList.add('hidden');
                tabDriverBtn.className = "flex-1 py-3 font-semibold text-center bg-blue-600 text-white";
                tabAdminBtn.className = "flex-1 py-3 font-semibold text-center bg-gray-100 text-gray-600 hover:bg-gray-200";
            } else {
                driverPanel.classList.add('hidden');
                adminPanel.classList.remove('hidden');
                tabAdminBtn.className = "flex-1 py-3 font-semibold text-center bg-blue-600 text-white";
                tabDriverBtn.className = "flex-1 py-3 font-semibold text-center bg-gray-100 text-gray-600 hover:bg-gray-200";
            }
        }

        // SAVE SHIFT
        function saveShift(e) {
            e.preventDefault();
            const shift = {
                driverName: document.getElementById('driverName').value,
                plateNumber: document.getElementById('plateNumber').value,
                startKm: Number(document.getElementById('startKm').value),
                endKm: Number(document.getElementById('endKm').value),
                date: new Date().toISOString().split('T')[0],
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection('shifts').add(shift).then(() => {
                alert("Műszak sikeresen rögzítve!");
                document.getElementById('shiftForm').reset();
                loadAllShifts();
            }).catch(err => alert("Hiba mentéskor: " + err.message));
        }

        // LOAD SHIFTS FOR ADMIN
        function loadAllShifts() {
            db.collection('shifts').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
                allShifts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                populateDriverSelect();
            });
        }

        function populateDriverSelect() {
            const select = document.getElementById('adminDriverSelect');
            const drivers = [...new Set(allShifts.map(s => s.driverName))];
            
            select.innerHTML = '<option value="">-- Válassz sofőrt --</option>';
            drivers.forEach(driver => {
                const opt = document.createElement('option');
                opt.value = driver;
                opt.textContent = driver;
                select.appendChild(opt);
            });
        }

        function onDriverSelected() {
            const driverName = document.getElementById('adminDriverSelect').value;
            const dateSelect = document.getElementById('adminShiftDateSelect');
            
            if (!driverName) {
                dateSelect.innerHTML = '<option value="">-- Előbb válassz sofőrt --</option>';
                dateSelect.disabled = true;
                document.getElementById('shiftDetailsContainer').classList.add('hidden');
                document.getElementById('noShiftMessage').classList.remove('hidden');
                return;
            }

            currentDriverShifts = allShifts.filter(s => s.driverName === driverName);
            dateSelect.disabled = false;
            dateSelect.innerHTML = '';

            currentDriverShifts.forEach((shift, index) => {
                const opt = document.createElement('option');
                opt.value = shift.id;
                opt.textContent = `${shift.date} ${index === 0 ? '(Legfrissebb)' : ''}`;
                dateSelect.appendChild(opt);
            });

            // Auto-select latest
            dateSelect.selectedIndex = 0;
            renderSelectedShift();
        }

        function renderSelectedShift() {
            const shiftId = document.getElementById('adminShiftDateSelect').value;
            selectedShiftData = currentDriverShifts.find(s => s.id === shiftId);

            if (!selectedShiftData) return;

            document.getElementById('noShiftMessage').classList.add('hidden');
            document.getElementById('shiftDetailsContainer').classList.remove('hidden');

            const content = document.getElementById('shiftDetailsContent');
            content.innerHTML = `
                <div><span class="text-gray-500 block">Sofőr:</span> <strong>${selectedShiftData.driverName}</strong></div>
                <div><span class="text-gray-500 block">Rendszám:</span> <strong>${selectedShiftData.plateNumber}</strong></div>
                <div><span class="text-gray-500 block">Kezdő KM:</span> <strong>${selectedShiftData.startKm} km</strong></div>
                <div><span class="text-gray-500 block">Záró KM:</span> <strong>${selectedShiftData.endKm} km</strong></div>
                <div><span class="text-gray-500 block">Megtett KM:</span> <strong>${selectedShiftData.endKm - selectedShiftData.startKm} km</strong></div>
                <div><span class="text-gray-500 block">Dátum:</span> <strong>${selectedShiftData.date}</strong></div>
            `;
        }

        // PDF IN NEW TAB (BLOB URL)
        function previewPDF() {
            if (!selectedShiftData) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(18);
            doc.text("MENETLEVÉL IGAZOLÁS", 14, 20);

            doc.setFontSize(11);
            doc.text(`Kiállítás dátuma: ${new Date().toLocaleDateString('hu-HU')}`, 14, 28);

            doc.autoTable({
                startY: 35,
                head: [['Mező', 'Érték']],
                body: [
                    ['Sofőr neve', selectedShiftData.driverName],
                    ['Gépjármű rendszáma', selectedShiftData.plateNumber],
                    ['Dátum', selectedShiftData.date],
                    ['Kezdő kilométeróra állás', `${selectedShiftData.startKm} km`],
                    ['Záró kilométeróra állás', `${selectedShiftData.endKm} km`],
                    ['Összesen megtett távolság', `${selectedShiftData.endKm - selectedShiftData.startKm} km`]
                ],
                theme: 'grid'
            });

            // Open in new tab via Blob URL
            const blob = doc.output('bloburl');
            window.open(blob, '_blank');
        }

        function deleteCurrentShift() {
            if (!selectedShiftData) return;
            if (confirm("Biztosan törölni szeretnéd ezt a műszakot?")) {
                db.collection('shifts').doc(selectedShiftData.id).delete().then(() => {
                    alert("Műszak törölve.");
                    onDriverSelected();
                });
            }
        }
    </script>
</body>
</html>
