<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Menetlevél Nyilvántartó</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jsPDF & autoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #tripsTableBody, #tripsTableBody *, table, table * {
        visibility: visible;
        color: black !important;
      }
      table {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      button {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-950 min-h-screen text-slate-100 font-sans pb-10">

  <!-- BEJELENTKEZÉSI KÉPERNYŐ -->
  <div id="authScreen" class="max-w-md mx-auto min-h-screen flex flex-col justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-6">
      <div class="text-center space-y-1">
        <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-red-500">Menetlevél</h2>
        <p class="text-xs text-slate-400">Jelentkezz be a folytatáshoz</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Email cím</label>
          <input type="email" id="loginEmail" required class="w-full bg-slate-800 border border-slate-700 text-white p-3 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Jelszó</label>
          <input type="password" id="loginPassword" required class="w-full bg-slate-800 border border-slate-700 text-white p-3 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-red-600 text-white py-3.5 rounded-xl font-bold hover:opacity-90 active:scale-[0.98] transition">Bejelentkezés</button>
      </form>
      <p id="authError" class="text-red-400 text-sm text-center hidden bg-red-950/50 border border-red-800/50 p-2 rounded-xl"></p>
    </div>
  </div>

  <!-- FŐ ALKALMAZÁS KÉPERNYŐ -->
  <div id="appScreen" class="hidden max-w-2xl mx-auto p-3 space-y-4">
    
    <!-- FEJLÉC -->
    <header class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-red-500">Menetlevél Rendszer</h1>
        <p id="userStatus" class="text-[11px] text-slate-400 truncate max-w-[150px] sm:max-w-none"></p>
      </div>
      <div class="flex items-center gap-2">
        <button id="toggleAdminBtn" onclick="toggleAdminViewPrompt()" class="bg-amber-500/20 border border-amber-500/40 text-amber-400 hover:bg-amber-500/30 px-3 py-2 rounded-xl text-xs font-semibold transition">
          👑 Admin
        </button>
        <button onclick="logout()" class="bg-red-500/20 border border-red-500/40 text-red-400 hover:bg-red-500/30 px-3 py-2 rounded-xl text-xs font-semibold transition">Kilépés</button>
      </div>
    </header>

    <!-- ADMIN PANEL -->
    <div id="adminSection" class="hidden space-y-4 border-2 border-amber-500/40 p-4 rounded-2xl bg-amber-950/10">
      <div class="flex justify-between items-center border-b border-amber-500/20 pb-3">
        <h2 class="text-base font-bold text-amber-400 flex items-center gap-1">👑 Adminisztráció</h2>
        <span class="text-[10px] font-semibold bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full border border-amber-500/30">PIN Védett</span>
      </div>

      <!-- 1. PDF EXPORTÁLÁS (SZŰRÉSSEL) -->
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3">
        <h3 class="text-sm font-bold text-orange-400 border-b border-slate-800 pb-2">📄 Szűrt PDF Exportálás</h3>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Sofőr kiválasztása</label>
            <select id="pdfDriverSelect" class="w-full bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl text-sm focus:ring-2 focus:ring-orange-500">
              <option value="all">-- Összes Sofőr --</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Menetlevél Típusa</label>
              <select id="pdfTypeSelect" class="w-full bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl text-sm focus:ring-2 focus:ring-orange-500">
                <option value="work">Munkakilométer</option>
                <option value="private">Privát út</option>
                <option value="all">Összesített (Munka + Privát)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Időszak</label>
              <select id="pdfPeriodSelect" onchange="toggleCustomPdfDates()" class="w-full bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl text-sm focus:ring-2 focus:ring-orange-500">
                <option value="daily">Napi</option>
                <option value="weekly">Heti</option>
                <option value="monthly" selected>Havi</option>
                <option value="yearly">Éves</option>
                <option value="custom">Egyedi dátum</option>
              </select>
            </div>
          </div>

          <div id="pdfCustomDateContainer" class="hidden grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-slate-400">Kezdő dátum</label>
              <input type="date" id="pdfStartDate" class="w-full bg-slate-800 border border-slate-700 text-white p-2 rounded-xl text-xs">
            </div>
            <div>
              <label class="block text-[10px] text-slate-400">Záró dátum</label>
              <input type="date" id="pdfEndDate" class="w-full bg-slate-800 border border-slate-700 text-white p-2 rounded-xl text-xs">
            </div>
          </div>

          <button onclick="generateAdminPDF()" class="w-full bg-gradient-to-r from-orange-500 to-red-600 hover:opacity-90 text-white py-3 rounded-xl font-bold text-sm shadow-md transition flex justify-center items-center gap-2">
            📄 Szűrt PDF Generálása
          </button>
        </div>
      </div>

      <!-- 2. JÁRMŰPARK KEZELÉSE -->
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3">
        <h3 class="text-sm font-bold text-orange-400 border-b border-slate-800 pb-2">🚗 Járműpark Kezelése</h3>
        <form id="addCarForm" class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="carPlateInput" placeholder="Rendszám (ABC-123)" required class="bg-slate-800 border border-
