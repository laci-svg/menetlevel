!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menetlevél Admin Teszt</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="flex justify-between items-center bg-white p-6 rounded-xl shadow-md">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Menetlevél Rendszer (Teszt)</h1>
                <p id="user-info" class="text-sm text-gray-500 mt-1">Betöltés...</p>
            </div>
            <button id="logout-btn" onclick="logout()" class="hidden bg-red-600 hover:bg-red-700 text-white font-medium px-4 py-2 rounded-lg transition">
                Kijelentkezés
            </button>
        </header>

        <!-- Auth Section -->
        <section id="auth-section" class="bg-white p-6 rounded-xl shadow-md max-w-md mx-auto">
            <h2 class="text-xl font-semibold mb-4 text-center">Bejelentkezés</h2>
            <form id="login-form" onsubmit="login(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">E-mail cím</label>
                    <input type="email" id="login-email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Jelszó</label>
                    <input type="password" id="login-password" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-md font-medium transition">
                    Bejelentkezés
                </button>
            </form>
            <p id="auth-error" class="text-red-500 text-sm mt-3 text-center hidden"></p>
        </section>

        <!-- Main Dashboard (Admin Panel) -->
        <main id="app-section" class="hidden space-y-6">
            
            <!-- Unified Shift Inspection & PDF Container -->
            <section class="bg-white p-6 rounded-xl shadow-md">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-gray-200">
                    <div>
                        <h2 class="text-xl font-bold text-gray-800">Műszakok Megtekintése & Exportálása</h2>
                        <p class="text-sm text-gray-500">Válassz sofőrt és műszakot a megtekintéshez és a PDF megnyitásához.</p>
                    </div>

                    <!-- Controls: Driver Select & Shift Date Select -->
                    <div class="flex flex-wrap items-center gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Sofőr</label>
                            <select id="driver-select" onchange="onDriverChange()" class="border border-gray-300 rounded-lg p-2 text-sm bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                                <option value="">Sofőr kiválasztása...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Műszak Dátuma</label>
                            <select id="shift-select" onchange="renderSelectedShift()" class="border border-gray-300 rounded-lg p-2 text-sm bg-gray-50 focus:ring-blue-500 focus:border-blue-500" disabled>
                                <option value="">Előbb válassz sofőrt...</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Shift Details View Area -->
                <div id="shift-detail-container" class="mt-6 hidden">
                    <div class="flex justify-between items-center mb-4 bg-gray-50 p-4 rounded-lg">
                        <div>
                            <h3 id="shift-title" class="font-bold text-lg text-gray-800"></h3>
                            <span id="shift-status-badge" class="inline-block px-2 py-1 text-xs font-semibold rounded mt-1"></span>
                        </div>
                        <div class="flex gap-2">
                            <button id="pdf-btn" onclick="openShiftPdf()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                Megnyitás PDF-ben
                            </button>
                            <button id="delete-shift-btn" onclick="deleteCurrentShift()" class="bg-red-100 text-red-600 hover:bg-red-200 px-3 py-2 rounded-lg text-sm font-medium transition">
                                Műszak Törlése
                            </button>
                        </div>
                    </div>

                    <!-- Entries Table -->
                    <div class="overflow-x-auto border border-gray-200 rounded-lg">
                        <table class="min-w-full divide-y divide-gray-200 text-sm">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-4 py-3 text-left font-medium text-gray-500">Idő</th>
                                    <th class="px-4 py-3 text-left font-medium text-gray-500">Honnan</th>
                                    <th class="px-4 py-3 text-left font-medium text-gray-500">Hova</th>
                                    <th class="px-4 py-3 text-left font-medium text-gray-500">KM</th>
                                    <th class="px-4 py-3 text-left font-medium text-gray-500">Utas / Megjegyzés</th>
                                </tr>
                            </thead>
                            <tbody id="entries-table-body" class="divide-y divide-gray-200 bg-white">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Empty State -->
                <div id="shift-empty-state" class="text-center py-12 text-gray-400">
                    Válassz ki egy sofőrt a műszakok betöltéséhez.
                </div>
            </section>

        </main>
    </div>

    <!-- Firebase Init & Application Logic -->
    <script>
        // 1. Firebase inicializálás a megadott adatokkal
        const firebaseConfig = {
            apiKey: "AIzaSyCzpvcJSd08o2mpLOibQKEv6tLes0BixFM",
            authDomain: "menetlevel-3563a.firebaseapp.com",
            projectId: "menetlevel-3563a",
            storageBucket: "menetlevel-3563a.firebasestorage.app",
            messagingSenderId: "306355505023",
            appId: "1:306355505023:web:fdd44585f7946d6fddfc4a",
            measurementId: "G-9NNKD3N84H"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentDriverShifts = [];
        let selectedShiftData = null;

        // Auth figyelő
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
                document.getElementById('user-info').innerText = `Bejelentkezve: ${user.email}`;
                loadDrivers();
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
                document.getElementById('logout-btn').classList.add('hidden');
            }
        });

        // Bejelentkezés
        function login(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const errEl = document.getElementById('auth-error');

            auth.signInWithEmailAndPassword(email, pass)
                .catch(err => {
                    errEl.innerText = "Sikeretlen bejelentkezés: " + err.message;
                    errEl.classList.remove('hidden');
                });
        }

        // Kijelentkezés
        function logout() {
            auth.signOut();
        }

        // Sofőrök betöltése
        async function loadDrivers() {
            const select = document.getElementById('driver-select');
            select.innerHTML = '<option value="">Sofőr kiválasztása...</option>';
            
            try {
                const snapshot = await db.collection('users').get();
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const opt = document.createElement('option');
                    opt.value = doc.id;
                    opt.innerText = data.name || data.email || doc.id;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error("Hiba a sofőrök betöltésekor:", err);
            }
        }

        // Sofőr váltás
        async function onDriverChange() {
            const driverId = document.getElementById('driver-select').value;
            const shiftSelect = document.getElementById('shift-select');
            const detailContainer = document.getElementById('shift-detail-container');
            const emptyState = document.getElementById('shift-empty-state');

            shiftSelect.innerHTML = '';
            shiftSelect.disabled = true;
            detailContainer.classList.add('hidden');
            emptyState.classList.remove('hidden');
            selectedShiftData = null;

            if (!driverId) return;

            try {
                const snapshot = await db.collection('shifts')
                    .where('userId', '==', driverId)
                    .orderBy('startTime', 'desc')
                    .get();

                currentDriverShifts = [];
                snapshot.forEach(doc => {
                    currentDriverShifts.push({ id: doc.id, ...doc.data() });
                });

                if (currentDriverShifts.length === 0) {
                    emptyState.innerText = "Ennek a sofőrnek nincsenek rögzített műszakai.";
                    return;
                }

                shiftSelect.disabled = false;
                currentDriverShifts.forEach((shift, index) => {
                    const opt = document.createElement('option');
                    opt.value = shift.id;
                    const dateStr = shift.startTime ? new Date(shift.startTime.toDate()).toLocaleString('hu-HU') : 'Ismeretlen dátum';
                    opt.innerText = `${dateStr} (${shift.status === 'closed' ? 'Zárt' : 'Nyitott'})`;
                    shiftSelect.appendChild(opt);
                });

                // Alapértelmezetten a legújabbat jelenítjük meg
                shiftSelect.selectedIndex = 0;
                renderSelectedShift();

            } catch (err) {
                console.error("Hiba a műszakok lekérésekor:", err);
            }
        }

        // Kiválasztott műszak megjelenítése
        function renderSelectedShift() {
            const shiftId = document.getElementById('shift-select').value;
            const detailContainer = document.getElementById('shift-detail-container');
            const emptyState = document.getElementById('shift-empty-state');
            const tbody = document.getElementById('entries-table-body');

            selectedShiftData = currentDriverShifts.find(s => s.id === shiftId);

            if (!selectedShiftData) {
                detailContainer.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            detailContainer.classList.remove('hidden');

            const startDate = selectedShiftData.startTime ? new Date(selectedShiftData.startTime.toDate()).toLocaleString('hu-HU') : '-';
            document.getElementById('shift-title').innerText = `Műszak: ${startDate}`;
            
            const badge = document.getElementById('shift-status-badge');
            if (selectedShiftData.status === 'closed') {
                badge.innerText = 'Lezárt műszak';
                badge.className = 'inline-block px-2 py-1 text-xs font-semibold rounded mt-1 bg-green-100 text-green-800';
            } else {
                badge.innerText = 'Aktív / Nyitott műszak';
                badge.className = 'inline-block px-2 py-1 text-xs font-semibold rounded mt-1 bg-yellow-100 text-yellow-800';
            }

            tbody.innerHTML = '';
            const entries = selectedShiftData.entries || [];

            if (entries.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-3 text-center text-gray-400">Nincsenek bejegyzések ebben a műszakban.</td></tr>`;
                return;
            }

            entries.forEach(entry => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-4 py-3 font-mono">${entry.time || '-'}</td>
                    <td class="px-4 py-3">${entry.from || '-'}</td>
                    <td class="px-4 py-3">${entry.to || '-'}</td>
                    <td class="px-4 py-3 font-semibold">${entry.km || 0} km</td>
                    <td class="px-4 py-3 text-gray-600">${entry.note || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Műszak törlése
        async function deleteCurrentShift() {
            if (!selectedShiftData) return;
            if (!confirm("Biztosan törölni szeretnéd ezt a műszakot? Ez a művelet nem visszavonható!")) return;

            try {
                await db.collection('shifts').doc(selectedShiftData.id).delete();
                alert("Műszak sikeresen törölve.");
                onDriverChange(); // Lista frissítése
            } catch (err) {
                alert("Hiba történt a törlés során: " + err.message);
            }
        }

        // PDF Generálás és Megnyitás új ablakban (In-browser preview)
        function openShiftPdf() {
            if (!selectedShiftData) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const driverName = document.getElementById('driver-select').selectedOptions[0].text;
            const startDate = selectedShiftData.startTime ? new Date(selectedShiftData.startTime.toDate()).toLocaleString('hu-HU') : '-';

            // Cím fejléc
            doc.setFontSize(18);
            doc.text("MENETLEVÉL ÖSSZESÍTŐ", 14, 20);

            doc.setFontSize(11);
            doc.text(`Sofőr: ${driverName}`, 14, 30);
            doc.text(`Műszak kezdete: ${startDate}`, 14, 36);
            doc.text(`Státusz: ${selectedShiftData.status === 'closed' ? 'Lezárt' : 'Nyitott'}`, 14, 42);

            // Táblázat oszlopok & adatok
            const tableColumn = ["Idő", "Honnan", "Hova", "KM", "Megjegyzés / Utas"];
            const tableRows = [];

            (selectedShiftData.entries || []).forEach(entry => {
                tableRows.push([
                    entry.time || '',
                    entry.from || '',
                    entry.to || '',
                    `${entry.km || 0} km`,
                    entry.note || ''
                ]);
            });

            doc.autoTable({
                head: [tableColumn],
                body: tableRows,
                startY: 50,
                theme: 'grid',
                headStyles: { fillColor: [41, 128, 185] }
            });

            // Megnyitás új böngészőlapon letöltés helyett
            const pdfBlobUrl = doc.output('bloburl');
            window.open(pdfBlobUrl, '_blank');
        }
    </script>
</body>
</html>
